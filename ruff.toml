# Lint configuration.
#
# The selected rules are the ones that catch *broken* code, not style. This is
# deliberate: the repository has no formatting convention to enforce and a
# thousand cosmetic warnings would train everyone to ignore the output.
#
# The rule that earns this file on its own is F821, undefined name. WeddingElement
# was used at six call sites in app.py and never imported, so every Ceremony page
# raised NameError in production while CI stayed green -- CI ran py_compile, which
# only checks syntax and cannot see an undefined name. F821 finds all six in under
# a second.
#
# Run locally with:  ruff check .

target-version = "py311"
line-length = 120

[lint]
select = [
    "E9",    # syntax and IO errors
    "F63",   # comparisons that are always true/false
    "F7",    # misplaced statements (break outside loop, etc.)
    "F82",   # undefined names
    "F402",  # import shadowed by a loop variable
    "F811",  # redefinition of an unused name
    "F502",  # percent-format with a dict where a tuple is expected
    "F522",  # .format() call with unused named arguments
    "F524",  # .format() call missing an argument
    "B002",  # unary prefix increment, which does nothing in Python
]

# Unused imports and unused locals are not selected. They are real untidiness,
# but app.py has a settled idiom -- `wedding = get_wedding_or_403(wedding_id)`
# called for its access check and discarded -- that would trip F841 in a dozen
# handlers. Gating on it would mean churning those lines for no behavioural
# change. Clean them up separately if you want them gone.

[lint.per-file-ignores]
# Migrations are generated by Alembic; leave them as they are emitted.
"migrations/versions/*.py" = ["E9", "F82"]
