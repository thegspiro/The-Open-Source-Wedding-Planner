{% extends "base.html" %}
{% block title %}Record Gift - {{ wedding.couple_names }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Record Gift</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="event">Event *</label>
            <select name="event" required id="event">
                <option value="engagement">Engagement Party</option>
                <option value="shower">Wedding Shower</option>
                <option value="wedding" selected>Wedding Day</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="from-name">From *</label>
            <input type="text" name="from_name" required placeholder="e.g., Aunt Susan & Uncle Bob" id="from-name">
        </div>
        <div class="form-group">
            <label for="description">Gift Description</label>
            <textarea name="description" rows="2" placeholder="e.g., KitchenAid Stand Mixer, silver" id="description"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="estimated-value">Estimated Value ($)</label>
                <input type="number" name="estimated_value" step="0.01" min="0" id="estimated-value">
            </div>
            <div class="form-group">
                <label for="date-received">Date Received</label>
                <input type="date" name="date_received" id="date-received">
            </div>
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" rows="2" placeholder="e.g., Registry item, need to exchange for correct color" id="notes"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Record Gift</button>
            <a href="{{ url_for('gifts_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
