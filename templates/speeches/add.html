{% extends "base.html" %}

{% block title %}Add Speech/Toast - {{ wedding.couple_names }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add Speech/Toast</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('speeches_add', wedding_id=wedding.id) }}">
        <div class="form-group">
            <label for="speaker-name">Speaker Name *</label>
            <input type="text" name="speaker_name" required placeholder="e.g., Best Man, Maid of Honor" id="speaker-name">
        </div>
        <div class="form-group">
            <label for="speech-type">Type *</label>
            <select name="speech_type" required id="speech-type">
                <option value="">-- Select --</option>
                <option value="toast">Toast</option>
                <option value="speech">Speech</option>
                <option value="blessing">Blessing</option>
                <option value="roast">Roast</option>
            </select>
        </div>
        <div class="form-group">
            <label for="order">Order</label>
            <input type="number" name="order" min="0" placeholder="e.g., 1" id="order">
        </div>
        <div class="form-group">
            <label for="duration-minutes">Duration (minutes)</label>
            <input type="number" name="duration_minutes" min="0" placeholder="e.g., 5" id="duration-minutes">
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" rows="4" placeholder="Any notes about the speech or toast..." id="notes"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Speech</button>
            <a href="{{ url_for('speeches_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
