{% extends "base.html" %}
{% block title %}Add Sign - {{ wedding.couple_names }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Sign</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Sign Name *</label>
                <input type="text" name="name" required placeholder="e.g., Welcome Sign">
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select name="category" required>
                    <option value="">-- Select --</option>
                    <option value="ceremony">Ceremony</option>
                    <option value="reception">Reception</option>
                    <option value="directional">Directional</option>
                    <option value="informational">Informational</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="2" placeholder="What does this sign say or show?"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" placeholder="Where will it be placed?">
            </div>
            <div class="form-group">
                <label>Size</label>
                <input type="text" name="size" placeholder="e.g., 24x36, 8.5x11">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Material</label>
                <input type="text" name="material" placeholder="e.g., acrylic, chalkboard, printed">
            </div>
            <div class="form-group">
                <label>Vendor / Made By</label>
                <input type="text" name="vendor" placeholder="Who is making it?">
            </div>
            <div class="form-group">
                <label>Cost ($)</label>
                <input type="number" name="cost" step="0.01" min="0">
            </div>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="needed">Needed</option>
                <option value="ordered">Ordered</option>
                <option value="received">Received</option>
                <option value="placed">Placed</option>
            </select>
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="2" placeholder="Additional notes"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Sign</button>
            <a href="{{ url_for('signage_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
