{% extends "base.html" %}
{% block title %}New Wedding - Wedding Organizer{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Create New Wedding</h1>
    <a href="{{ url_for('index') }}" class="btn-secondary">Back</a>
</div>

<div class="form-container">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">💒</div>
        <p style="color: var(--color-text-light); font-size: 0.95rem;">Enter the basic details to get started. You can add more later.</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="num_people">How many people are getting married?</label>
            <select name="num_people" id="num_people" onchange="updateNameFields()">
                <option value="2" selected>2 people</option>
                <option value="3">3 people</option>
                <option value="4">4 people</option>
                <option value="5">5 people</option>
            </select>
        </div>

        <div id="name-fields">
            <div class="form-group">
                <label for="person-0-name">Person 1 Name</label>
                <input type="text" name="person_0_name" required placeholder="e.g., Sarah" id="person-0-name">
            </div>
            <div class="form-group">
                <label for="person-1-name">Person 2 Name</label>
                <input type="text" name="person_1_name" required placeholder="e.g., James" id="person-1-name">
            </div>
        </div>

        <div class="form-group">
            <label for="wedding-date">Wedding Date</label>
            <input type="date" name="wedding_date" required id="wedding-date">
        </div>
        <div class="form-group">
            <label for="email">Contact Email</label>
            <input type="email" name="email" required placeholder="you@example.com" id="email">
        </div>
        <div class="form-actions" style="justify-content: center;">
            <button type="submit" class="btn-primary" style="padding: 0.7rem 2rem;">Create Wedding</button>
            <a href="{{ url_for('index') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
function updateNameFields() {
    const num = parseInt(document.getElementById('num_people').value);
    const container = document.getElementById('name-fields');
    container.innerHTML = '';
    for (let i = 0; i < num; i++) {
        const div = document.createElement('div');
        div.className = 'form-group';
        div.innerHTML = '<label>Person ' + (i + 1) + ' Name</label>' +
            '<input type="text" name="person_' + i + '_name" required placeholder="e.g., ' + ['Sarah', 'James', 'Alex', 'Jordan', 'Casey'][i] + '">';
        container.appendChild(div);
    }
}
</script>
{% endblock %}
