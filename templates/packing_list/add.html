{% extends "base.html" %}
{% block title %}Add Packing Item - {{ wedding.couple_names }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Packing Item</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="item-name">Item Name *</label>
            <input type="text" name="item_name" required placeholder="e.g., Wedding rings" id="item-name">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <select name="category" id="category">
                    <option value="documents">Documents & Paperwork</option>
                    <option value="ceremony">Ceremony Items</option>
                    <option value="reception">Reception Items</option>
                    <option value="attire">Attire & Clothing</option>
                    <option value="accessories">Accessories & Jewelry</option>
                    <option value="personal">Personal Items</option>
                    <option value="gifts">Gifts & Cards</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="assigned-to">Assigned To</label>
                <input type="text" name="assigned_to" placeholder="Who is responsible for bringing it?" id="assigned-to">
            </div>
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" rows="2" placeholder="Additional details" id="notes"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Item</button>
            <a href="{{ url_for('packing_list_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
