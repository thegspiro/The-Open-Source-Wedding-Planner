{% extends "base.html" %}
{% block title %}Add Day-of Contact - {{ wedding.couple_names }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Day-of Contact</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" name="name" required placeholder="e.g., Sarah Johnson" id="name">
            </div>
            <div class="form-group">
                <label for="role">Role *</label>
                <input type="text" name="role" required placeholder="e.g., Photographer, MOH, DJ" id="role">
            </div>
        </div>
        <div class="form-group">
            <label for="category">Category *</label>
            <select name="category" required id="category">
                <option value="">-- Select --</option>
                <option value="vendor">Vendor</option>
                <option value="wedding_party">Wedding Party</option>
                <option value="family">Family</option>
                <option value="coordinator">Coordinator / Planner</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" placeholder="Phone number" id="phone">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" placeholder="Email address" id="email">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="arrival-time">Arrival Time</label>
                <input type="text" name="arrival_time" placeholder="e.g., 10:00 AM" id="arrival-time">
            </div>
            <div class="form-group">
                <label for="departure-time">Departure Time</label>
                <input type="text" name="departure_time" placeholder="e.g., 11:00 PM" id="departure-time">
            </div>
        </div>
        <div class="form-group">
            <label for="setup-location">Setup Location</label>
            <input type="text" name="setup_location" placeholder="Where they should go on arrival" id="setup-location">
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" rows="2" placeholder="Special instructions, parking info, etc." id="notes"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Contact</button>
            <a href="{{ url_for('day_of_contacts_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
