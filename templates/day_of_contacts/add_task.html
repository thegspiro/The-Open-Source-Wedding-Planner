{% extends "base.html" %}
{% block title %}Add Day-of Task - {{ wedding.couple_names }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Day-of Task</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label>Task *</label>
            <input type="text" name="task" required placeholder="e.g., Collect gifts and cards at end of night">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Assigned To</label>
                <input type="text" name="assigned_to" placeholder="Who is responsible?">
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select name="category" required>
                    <option value="">-- Select --</option>
                    <option value="setup">Setup / Before Ceremony</option>
                    <option value="during">During the Event</option>
                    <option value="breakdown">End of Night / Breakdown</option>
                    <option value="emergency">Emergency / All Day</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Timing</label>
            <input type="text" name="timing" placeholder="e.g., Before ceremony, End of night, All day">
        </div>
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="2" placeholder="Additional details"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Task</button>
            <a href="{{ url_for('day_of_contacts_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
