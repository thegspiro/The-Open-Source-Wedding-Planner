{% extends "base.html" %}
{% block title %}Add Name Change Task - {{ wedding.couple_names }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Name Change Task</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="task-name">Task *</label>
            <input type="text" name="task_name" required placeholder="e.g., Update passport" id="task-name">
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category">
                <option value="government">Government IDs</option>
                <option value="financial">Financial Accounts</option>
                <option value="insurance">Insurance</option>
                <option value="employment">Employment</option>
                <option value="medical">Medical</option>
                <option value="personal">Personal & Other</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="reference-number">Reference / Confirmation Number</label>
            <input type="text" name="reference_number" placeholder="Track confirmation numbers here" id="reference-number">
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" rows="2" placeholder="Requirements, documents needed, website URL, etc." id="notes"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Task</button>
            <a href="{{ url_for('name_change_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
