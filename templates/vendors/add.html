{% extends "base.html" %}

{% block title %}Add Vendor - {{ wedding.couple_names }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add Vendor</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('vendor_add', wedding_id=wedding.id) }}">
        <h2>Vendor Information</h2>
        <div class="form-group">
            <label for="category">Category *</label>
            <select name="category" required id="category">
                <option value="">-- Select --</option>
                <option value="photographer">Photographer</option>
                <option value="videographer">Videographer</option>
                <option value="caterer">Caterer</option>
                <option value="florist">Florist</option>
                <option value="DJ/band">DJ/Band</option>
                <option value="baker">Baker</option>
                <option value="officiant">Officiant</option>
                <option value="hair/makeup">Hair/Makeup</option>
                <option value="planner">Planner</option>
                <option value="rentals">Rentals</option>
                <option value="transportation">Transportation</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="business-name">Business Name *</label>
            <input type="text" name="business_name" required placeholder="e.g., Jane's Photography" id="business-name">
        </div>
        <div class="form-group">
            <label for="contact-name">Contact Name</label>
            <input type="text" name="contact_name" placeholder="Primary contact person" id="contact-name">
        </div>

        <h2>Contact Details</h2>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" placeholder="vendor@example.com" id="email">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" placeholder="Phone number" id="phone">
            </div>
            <div class="form-group">
                <label for="website">Website</label>
                <input type="url" name="website" placeholder="https://example.com" id="website">
            </div>
        </div>

        <h2>Financial</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="total-cost">Total Cost ($)</label>
                <input type="number" name="total_cost" step="0.01" min="0" placeholder="e.g., 5000" id="total-cost">
            </div>
            <div class="form-group">
                <label for="deposit-amount">Deposit Amount ($)</label>
                <input type="number" name="deposit_amount" step="0.01" min="0" placeholder="e.g., 1000" id="deposit-amount">
            </div>
        </div>

        <h2>Day-Of Details</h2>
        <div class="form-group">
            <label for="setup-instructions">Setup Instructions</label>
            <textarea name="setup_instructions" rows="3" placeholder="Where to set up, access details, timing..." id="setup-instructions"></textarea>
        </div>
        <div class="form-group">
            <label for="meals-needed">Vendor Meals Needed</label>
            <input type="number" name="meals_needed" min="0" placeholder="Number of vendor meals required" id="meals-needed">
        </div>

        <h2>Notes</h2>
        <div class="form-group">
            <label for="notes">Additional Notes</label>
            <textarea name="notes" rows="4" placeholder="Any additional details about this vendor..." id="notes"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Vendor</button>
            <a href="{{ url_for('vendors_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
