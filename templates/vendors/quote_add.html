{% extends "base.html" %}

{% block title %}Add Vendor Quote - {{ wedding.couple_names }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add Vendor Quote</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('vendor_quote_add', wedding_id=wedding.id) }}">
        <div class="form-group">
            <label for="category">Category *</label>
            <select name="category" required id="category">
                <option value="">-- Select --</option>
                <option value="photographer">Photographer</option>
                <option value="videographer">Videographer</option>
                <option value="caterer">Caterer</option>
                <option value="florist">Florist</option>
                <option value="DJ/band">DJ/Band</option>
                <option value="baker">Baker</option>
                <option value="officiant">Officiant</option>
                <option value="hair/makeup">Hair/Makeup</option>
                <option value="planner">Planner</option>
                <option value="rentals">Rentals</option>
                <option value="transportation">Transportation</option>
                <option value="venue">Venue</option>
                <option value="stationery">Stationery</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="vendor-name">Vendor Name *</label>
            <input type="text" name="vendor_name" required placeholder="e.g., Jane's Photography" id="vendor-name">
        </div>
        <div class="form-group">
            <label for="contact-info">Contact Info</label>
            <input type="text" name="contact_info" placeholder="Email or phone number" id="contact-info">
        </div>
        <div class="form-group">
            <label for="quote-amount">Quote Amount ($) *</label>
            <input type="number" name="quote_amount" step="0.01" min="0" required placeholder="e.g., 3500" id="quote-amount">
        </div>
        <div class="form-group">
            <label for="package-details">Package Details</label>
            <textarea name="package_details" rows="3" placeholder="What is included in this quote..." id="package-details"></textarea>
        </div>
        <div class="form-group">
            <label for="pros">Pros</label>
            <textarea name="pros" rows="3" placeholder="Advantages of this vendor/package..." id="pros"></textarea>
        </div>
        <div class="form-group">
            <label for="cons">Cons</label>
            <textarea name="cons" rows="3" placeholder="Disadvantages or concerns..." id="cons"></textarea>
        </div>
        <div class="form-group">
            <label for="date-received">Date Received</label>
            <input type="date" name="date_received" id="date-received">
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" rows="3" placeholder="Any additional notes about this quote..." id="notes"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Quote</button>
            <a href="{{ url_for('vendor_quotes_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
