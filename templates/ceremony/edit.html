{% extends "base.html" %}

{% block title %}Edit Ceremony - {{ wedding.couple_names }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Ceremony Details</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('ceremony_edit', wedding_id=wedding.id) }}">
        <h2>Venue Information</h2>
        <div class="form-group">
            <label for="venue-name">Venue Name</label>
            <input type="text" name="venue_name" value="{{ ceremony.venue_name or '' }}" placeholder="e.g., St. Mary's Church" id="venue-name">
        </div>
        <div class="form-group">
            <label for="venue-address">Venue Address</label>
            <input type="text" name="venue_address" value="{{ ceremony.venue_address or '' }}" placeholder="Full address" id="venue-address">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="venue-contact">Venue Contact</label>
                <input type="text" name="venue_contact" value="{{ ceremony.venue_contact or '' }}" placeholder="Contact name" id="venue-contact">
            </div>
            <div class="form-group">
                <label for="venue-phone">Venue Phone</label>
                <input type="text" name="venue_phone" value="{{ ceremony.venue_phone or '' }}" placeholder="Phone number" id="venue-phone">
            </div>
        </div>

        <div class="form-group">
            <label for="venue-load-in-time">Venue Load-In Time</label>
            <input type="time" name="venue_load_in_time" value="{{ ceremony.venue_load_in_time.strftime('%H:%M') if ceremony.venue_load_in_time else '' }}" id="venue-load-in-time">
            <p class="form-help">When vendors can start setting up at the venue</p>
        </div>

        <h2>Timing</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="start-time">Start Time</label>
                <input type="time" name="start_time" value="{{ ceremony.start_time.strftime('%H:%M') if ceremony.start_time else '' }}" id="start-time">
            </div>
            <div class="form-group">
                <label for="duration-minutes">Duration (minutes)</label>
                <input type="number" name="duration_minutes" value="{{ ceremony.duration_minutes or '' }}" min="1" placeholder="e.g., 45" id="duration-minutes">
            </div>
        </div>

        <h2>Officiant</h2>
        <div class="form-group">
            <label for="officiant-name">Officiant Name</label>
            <input type="text" name="officiant_name" value="{{ ceremony.officiant_name or '' }}" placeholder="Full name" id="officiant-name">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="officiant-contact">Officiant Contact</label>
                <input type="text" name="officiant_contact" value="{{ ceremony.officiant_contact or '' }}" placeholder="Email or contact info" id="officiant-contact">
            </div>
            <div class="form-group">
                <label for="officiant-phone">Officiant Phone</label>
                <input type="text" name="officiant_phone" value="{{ ceremony.officiant_phone or '' }}" placeholder="Phone number" id="officiant-phone">
            </div>
        </div>
        <div class="form-group">
            <label for="officiant-type">Officiant Type</label>
            <select name="officiant_type" id="officiant-type">
                <option value="">-- Select --</option>
                <option value="religious" {% if ceremony.officiant_type == 'religious' %}selected{% endif %}>Religious</option>
                <option value="civil" {% if ceremony.officiant_type == 'civil' %}selected{% endif %}>Civil</option>
                <option value="friend" {% if ceremony.officiant_type == 'friend' %}selected{% endif %}>Friend</option>
                <option value="family" {% if ceremony.officiant_type == 'family' %}selected{% endif %}>Family</option>
                <option value="other" {% if ceremony.officiant_type == 'other' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <h2>Ceremony Style</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="ceremony-style">Ceremony Style</label>
                <select name="ceremony_style" id="ceremony-style">
                    <option value="">-- Select --</option>
                    <option value="religious" {% if ceremony.ceremony_style == 'religious' %}selected{% endif %}>Religious</option>
                    <option value="secular" {% if ceremony.ceremony_style == 'secular' %}selected{% endif %}>Secular</option>
                    <option value="spiritual" {% if ceremony.ceremony_style == 'spiritual' %}selected{% endif %}>Spiritual</option>
                    <option value="cultural" {% if ceremony.ceremony_style == 'cultural' %}selected{% endif %}>Cultural</option>
                </select>
            </div>
            <div class="form-group">
                <label for="vow-type">Vow Type</label>
                <select name="vow_type" id="vow-type">
                    <option value="">-- Select --</option>
                    <option value="traditional" {% if ceremony.vow_type == 'traditional' %}selected{% endif %}>Traditional</option>
                    <option value="custom" {% if ceremony.vow_type == 'custom' %}selected{% endif %}>Custom</option>
                    <option value="mixed" {% if ceremony.vow_type == 'mixed' %}selected{% endif %}>Mixed</option>
                </select>
            </div>
        </div>

        <h2>Music</h2>
        <div class="form-group">
            <label for="processional-song">Processional Song</label>
            <input type="text" name="processional_song" value="{{ ceremony.processional_song or '' }}" placeholder="e.g., Canon in D" id="processional-song">
        </div>
        <div class="form-group">
            <label for="recessional-song">Recessional Song</label>
            <input type="text" name="recessional_song" value="{{ ceremony.recessional_song or '' }}" placeholder="e.g., Wedding March" id="recessional-song">
        </div>
        <div class="form-group">
            <label for="unity-ceremony-song">Unity Ceremony Song</label>
            <input type="text" name="unity_ceremony_song" value="{{ ceremony.unity_ceremony_song or '' }}" placeholder="Song during unity ceremony" id="unity-ceremony-song">
        </div>

        <h2>Special Elements</h2>
        <div class="form-group">
            <label>
                <input type="checkbox" name="has_unity_ceremony" {% if ceremony.has_unity_ceremony %}checked{% endif %} id="has-unity-ceremony">
                Include Unity Ceremony
            </label>
        </div>
        <div class="form-group">
            <label for="unity-ceremony-type">Unity Ceremony Type</label>
            <input type="text" name="unity_ceremony_type" value="{{ ceremony.unity_ceremony_type or '' }}" placeholder="e.g., candle, sand, wine" id="unity-ceremony-type">
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="has_special_readings" {% if ceremony.has_special_readings %}checked{% endif %} id="has-special-readings">
                Include Special Readings
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="{{ url_for('ceremony_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
