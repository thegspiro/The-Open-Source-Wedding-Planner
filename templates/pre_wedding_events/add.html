{% extends "base.html" %}
{% block title %}Add Pre-Wedding Event - {{ wedding.couple_names }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Pre-Wedding Event</h1>
</div>

<div class="form-container">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="event-type">Event Type *</label>
                <select name="event_type" required id="event-type">
                    <option value="">-- Select --</option>
                    {% for value, label in event_types %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="name">Event Name *</label>
                <input type="text" name="name" required placeholder="e.g., Jamie's Bridal Shower" id="name">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" name="date" id="date">
            </div>
            <div class="form-group">
                <label for="time">Start Time</label>
                <input type="text" name="time" placeholder="e.g., 2:00 PM" id="time">
            </div>
            <div class="form-group">
                <label for="end-time">End Time</label>
                <input type="text" name="end_time" placeholder="e.g., 5:00 PM" id="end-time">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="venue-name">Venue Name</label>
                <input type="text" name="venue_name" placeholder="e.g., The Garden Room" id="venue-name">
            </div>
            <div class="form-group">
                <label for="venue-address">Venue Address</label>
                <input type="text" name="venue_address" placeholder="Full address" id="venue-address">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="host-name">Host Name</label>
                <input type="text" name="host_name" placeholder="Who is hosting?" id="host-name">
            </div>
            <div class="form-group">
                <label for="host-phone">Host Phone</label>
                <input type="text" name="host_phone" placeholder="Phone number" id="host-phone">
            </div>
            <div class="form-group">
                <label for="host-email">Host Email</label>
                <input type="email" name="host_email" placeholder="Email" id="host-email">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="expected-guest-count">Expected Guest Count</label>
                <input type="number" name="expected_guest_count" min="0" id="expected-guest-count">
            </div>
            <div class="form-group">
                <label for="estimated-cost">Estimated Cost ($)</label>
                <input type="number" name="estimated_cost" step="0.01" min="0" id="estimated-cost">
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select name="status" id="status">
                    <option value="planning">Planning</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" rows="3" placeholder="Menu ideas, theme, dress code, special instructions..." id="notes"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Event</button>
            <a href="{{ url_for('pre_wedding_events_view', wedding_id=wedding.id) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
