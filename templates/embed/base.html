<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ wedding.couple_names }}{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #3d3530;
            background: {% if wedding.branding and wedding.branding.primary_color %}{{ wedding.branding.primary_color }}10{% else %}#fdf2f4{% endif %};
            padding: 1.5rem;
            line-height: 1.6;
        }
        h1 {
            font-size: 1.6rem;
            color: {% if wedding.branding and wedding.branding.primary_color %}{{ wedding.branding.primary_color }}{% else %}#b76e79{% endif %};
            margin-bottom: 0.25rem;
            text-align: center;
        }
        h2 {
            font-size: 1.15rem;
            color: {% if wedding.branding and wedding.branding.secondary_color %}{{ wedding.branding.secondary_color }}{% else %}#8b6f5e{% endif %};
            margin: 1.25rem 0 0.75rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid #e8e4e0;
        }
        .subtitle {
            text-align: center;
            color: #8b7f76;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .card h3 {
            font-size: 1rem;
            color: #3d3530;
            margin-bottom: 0.4rem;
        }
        .detail { color: #6b6560; font-size: 0.9rem; margin-bottom: 0.25rem; }
        .detail strong { color: #3d3530; }
        .badge {
            display: inline-block;
            background: {% if wedding.branding and wedding.branding.primary_color %}{{ wedding.branding.primary_color }}20{% else %}#fce4ec{% endif %};
            color: {% if wedding.branding and wedding.branding.primary_color %}{{ wedding.branding.primary_color }}{% else %}#b76e79{% endif %};
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        a { color: {% if wedding.branding and wedding.branding.accent_color %}{{ wedding.branding.accent_color }}{% else %}#c9956b{% endif %}; }
        .empty { text-align: center; color: #8b7f76; padding: 2rem 1rem; font-style: italic; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        @media (max-width: 500px) { body { padding: 1rem; } .grid { grid-template-columns: 1fr; } }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
